[package]
name = "skyline-launcher"
version = "1.1.2"
description = "SkyLine Launcher - A modern Minecraft launcher"
authors = ["you"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "skyline_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = ["protocol-asset", "custom-protocol"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
log = "0.4"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "gzip", "brotli"] }
tokio = { version = "1", features = ["full"] }
zip = "2"
flate2 = "1"
tar = "0.4"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "2"
dirs = "6"
url = "2"
futures = "0.3"
itertools = "0.14"
walkdir = "2"
tempfile = "3"
notify = "8"
os_info = "3"
regex = "1"
once_cell = "1"
base64 = "0.22"
fastrand = "2"
keyring = "3"
oauth2 = { path = "vendor/oauth2", features = ["reqwest", "rustls-tls"] }
minecraft-msa-auth = { path = "vendor/minecraft-msa-auth", default-features = false }
maybe-async = "0.2"
async-trait = "0.1"
http = "1"
async-recursion = "1"
num_cpus = "1"
miniz_oxide = "0.9.1"
edge-tts-rust = "0.1.3"
scraper = "0.22"

[profile.release]
codegen-units = 1
lto = "off"
panic = "abort"
opt-level = 1

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
webview2-com = "0.38"
windows-sys = { version = "0.59", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemServices",
] }


