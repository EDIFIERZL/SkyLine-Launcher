name: Build Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '22'
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  #  Shared frontend build  (upload dist artifact
  #  so platform jobs don't rebuild the JS bundle)
  # ──────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ──────────────────────────────────────────────
  #  Windows x64  (.exe  /  .msi  /  .zip)
  # ──────────────────────────────────────────────
  build-windows-x64:
    name: Windows x64
    runs-on: windows-latest
    needs: build-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry / build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-windows-x64-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install WiX (optional MSI)
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\WiX Toolset v3.14')) {
            Write-Host 'WiX not found – installing...'
            Invoke-WebRequest -Uri 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtw/wix314.exe' `
              -OutFile wix.exe -UseBasicParsing
            Start-Process wix.exe -ArgumentList '/quiet', '/norestart' -Wait
          }

      - name: Build Tauri app
        run: npx tauri build
        env:
          CI: 'true'

      - name: Upload Windows x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SkyLine-Launcher-windows-x64
          path: |
            src-tauri/bin/Release/**/*.exe
            src-tauri/bin/Release/**/*.msi
            src-tauri/bin/Release/**/*.zip
          retention-days: 7

  # ──────────────────────────────────────────────
  #  Windows ARM64  (.exe  /  .msi  /  .zip)
  # ──────────────────────────────────────────────
  build-windows-arm64:
    name: Windows ARM64
    runs-on: windows-latest
    needs: build-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install Rust stable + ARM64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Cache cargo registry / build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-windows-arm64-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install WiX
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\WiX Toolset v3.14')) {
            Invoke-WebRequest -Uri 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtw/wix314.exe' `
              -OutFile wix.exe -UseBasicParsing
            Start-Process wix.exe -ArgumentList '/quiet', '/norestart' -Wait
          }

      - name: Build Tauri app (ARM64)
        run: npx tauri build --target aarch64-pc-windows-msvc
        env:
          CI: 'true'

      - name: Upload Windows ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SkyLine-Launcher-windows-arm64
          path: |
            src-tauri/bin/aarch64-pc-windows-msvc/Release/**/*.exe
            src-tauri/bin/aarch64-pc-windows-msvc/Release/**/*.msi
            src-tauri/bin/aarch64-pc-windows-msvc/Release/**/*.zip
          retention-days: 7

  # ──────────────────────────────────────────────
  #  macOS x64 (Intel)  (.dmg  /  .app)
  # ──────────────────────────────────────────────
  build-macos-x64:
    name: macOS x64
    runs-on: macos-13   # Intel runner
    needs: build-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache cargo registry / build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-macos-x64-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install system dependencies
        run: brew install libappindicator gtk+3

      - name: Build Tauri app
        run: npx tauri build
        env:
          CI: 'true'
          # Uncomment and populate the secrets below if you want
          # automatic code-signing and notarisation:
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload macOS x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SkyLine-Launcher-macos-x64
          path: |
            src-tauri/bin/*/Release/bundle/dmg/*.dmg
            src-tauri/bin/*/Release/bundle/macos/*.app
          retention-days: 7

  # ──────────────────────────────────────────────
  #  macOS ARM64 (Apple Silicon / M-series)
  # ──────────────────────────────────────────────
  build-macos-arm64:
    name: macOS ARM64
    runs-on: macos-14   # Apple Silicon runner → native ARM build
    needs: build-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install Rust stable + ARM64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo registry / build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-macos-arm64-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install system dependencies
        run: brew install libappindicator gtk+3

      - name: Build Tauri app (ARM64)
        run: npx tauri build --target aarch64-apple-darwin
        env:
          CI: 'true'
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload macOS ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SkyLine-Launcher-macos-arm64
          path: |
            src-tauri/bin/aarch64-apple-darwin/Release/bundle/dmg/*.dmg
            src-tauri/bin/aarch64-apple-darwin/Release/bundle/macos/*.app
          retention-days: 7

  # ──────────────────────────────────────────────
  #  Linux x64  (.deb  /  .rpm  /  .AppImage)
  # ──────────────────────────────────────────────
  build-linux-x64:
    name: Linux x64
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            dpkg \
            libfuse2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo registry / build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-linux-x64-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install linuxdeploy (AppImage)
        run: |
          wget -qO- "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage" \
            > linuxdeploy.AppImage
          wget -qO- "https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage" \
            > linuxdeploy-plugin-appimage.AppImage
          chmod +x linuxdeploy*.AppImage
          sudo mv linuxdeploy*.AppImage /usr/local/bin/

      - name: Build Tauri app
        run: npx tauri build
        env:
          CI: 'true'

      - name: Upload Linux x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SkyLine-Launcher-linux-x64
          path: |
            src-tauri/bin/*/Release/bundle/appimage/*.AppImage
            src-tauri/bin/*/Release/bundle/deb/*.deb
            src-tauri/bin/*/Release/bundle/rpm/*.rpm
          retention-days: 7

  # ──────────────────────────────────────────────
  #  Linux ARM64  (.deb  /  .rpm  /  .AppImage)
  # ──────────────────────────────────────────────
  build-linux-arm64:
    name: Linux ARM64
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            dpkg

      - name: Install Rust stable + ARM64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cache cargo registry / build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-linux-arm64-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install linuxdeploy (AppImage)
        run: |
          wget -qO- "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-aarch64.AppImage" \
            > linuxdeploy.AppImage
          wget -qO- "https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-aarch64.AppImage" \
            > linuxdeploy-plugin-appimage.AppImage
          chmod +x linuxdeploy*.AppImage
          sudo mv linuxdeploy*.AppImage /usr/local/bin/

      - name: Build Tauri app (ARM64)
        run: npx tauri build --target aarch64-unknown-linux-gnu
        env:
          CI: 'true'
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Upload Linux ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SkyLine-Launcher-linux-arm64
          path: |
            src-tauri/bin/aarch64-unknown-linux-gnu/Release/bundle/appimage/*.AppImage
            src-tauri/bin/aarch64-unknown-linux-gnu/Release/bundle/deb/*.deb
            src-tauri/bin/aarch64-unknown-linux-gnu/Release/bundle/rpm/*.rpm
          retention-days: 7

  # ──────────────────────────────────────────────
  #  Aggregate: create a GitHub Release when a
  #  tag like v1.0.0 is pushed
  # ──────────────────────────────────────────────
  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - build-windows-x64
      - build-windows-arm64
      - build-macos-x64
      - build-macos-arm64
      - build-linux-x64
      - build-linux-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
